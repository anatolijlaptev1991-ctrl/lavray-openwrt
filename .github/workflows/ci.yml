# CI LAVRay (OpenWrt): быстрые проверки репозитория. Сборка ipk в SDK —
# отдельный workflow release-packages.yml (тяжёлая, по тегу или вручную).
# Actions запинены по commit SHA (аудит №5 P1-2); обновление — Dependabot.

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Линт структуры и Markdown
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Проверка структуры репозитория
        run: |
          set -eu
          test -f LICENSE    || { echo "Нет LICENSE"; exit 1; }
          test -f README.md || { echo "Нет README.md"; exit 1; }
          test -f .gitignore || { echo "Нет .gitignore"; exit 1; }
          test -f .github/workflows/ci.yml || { echo "Нет ci.yml"; exit 1; }
          test -f .github/ISSUE_TEMPLATE/bug_report.md    || { echo "Нет bug_report.md"; exit 1; }
          test -f .github/ISSUE_TEMPLATE/feature_request.md || { echo "Нет feature_request.md"; exit 1; }
          test -f feed/key.pub || { echo "Нет feed/key.pub (публичный ключ фида)"; exit 1; }
          echo "Структура OK"

      - name: Проверка Markdown
        run: |
          set -eu
          fail=0
          while IFS= read -r -d '' f; do
            # Незакрытые блоки кода (нечётное число ``` в файле)
            n=$(grep -c '^```' "$f" || true)
            if [ $((n % 2)) -ne 0 ]; then
              echo "::error file=$f::Нечётное число ограждений кода (\`\`\`)"
              fail=1
            fi
          done < <(find . -name '*.md' -not -path './.git/*' -print0)
          exit $fail

  packages:
    name: "Пакеты: синтаксис, JSON, ucode, структура"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: "Shell: sh -n по всем скриптам и файлам службы"
        run: |
          fail=0
          for f in $(git ls-files '*.sh' \
                     'lavrayd/files/lavrayd.init' \
                     'lavrayd/files/lavrayd-uci-defaults' \
                     'lavrayd/files/lavray-guard'); do
            echo "sh -n $f"
            sh -n "$f" || fail=1
          done
          exit $fail

      - name: "JSON: menu.d и acl.d"
        run: |
          set -euo pipefail
          for f in $(git ls-files '*.json'); do
            echo "json $f"
            python3 -m json.tool "$f" > /dev/null
          done

      - name: "JS: синтаксис представления LuCI"
        run: |
          node --check luci-app-lavray/files/www/luci-static/resources/view/lavray/status.js

      - name: "ucode: rpcd-плагин — структурные проверки"
        run: |
          set -euo pipefail
          f=luci-app-lavray/files/usr/share/rpcd/ucode/lavray
          grep -q "return { lavray:" "$f"
          for m in get_status get_web get_gateway get_setup_code get_policies \
                   set_gateway set_device_policy; do
            grep -q "^[[:space:]]*$m(" "$f" || { echo "нет метода $m" >&2; exit 1; }
          done
          # Токен ядра не должен попадать в возвращаемые значения методов
          # (return-строки; комментарии/ошибки вида core_token_invalid — нет).
          grep -q "core.token" "$f"
          if grep -nE '^\s*return [^;]*token' "$f"; then
            echo "FAIL: токен ядра утекает в ответ rpcd" >&2
            exit 1
          fi
          # Аудит №4 P2-2: временные файлы с токеном — в каталоге 0700.
          grep -q '/var/run/lavray/rpc' "$f" || {
            echo "FAIL: временные файлы с токеном не в 0700-каталоге" >&2; exit 1; }
          echo "ucode структура OK"

      - name: "Структура пакетов (спецификация §3)"
        run: |
          set -eu
          test -f lavrayd/Makefile
          test -f lavrayd/files/lavrayd.init
          test -f lavrayd/files/lavray.config
          test -f lavrayd/files/lavrayd-uci-defaults
          test -f lavrayd/files/lavray.nft
          test -f lavrayd/files/lavray-guard
          test -f lavrayd/files/lavrayd.keep
          test -f lavray-webui/Makefile
          test -f luci-app-lavray/Makefile
          test -f luci-app-lavray/files/usr/share/luci/menu.d/luci-app-lavray.json
          test -f luci-app-lavray/files/usr/share/rpcd/acl.d/luci-app-lavray.json
          test -f luci-app-lavray/files/usr/share/rpcd/ucode/lavray
          test -f luci-app-lavray/files/www/luci-static/resources/view/lavray/status.js
          # Аудит №1 P2-1/P3-4(в): key.pub обязателен и коммичен (не «появится
          # после workflow» — feed-key.yml удалён по P1-1).
          test -f feed/key.pub || { echo "Нет feed/key.pub"; exit 1; }
          echo "структура OK"

      - name: "Секреты в репозитории отсутствуют"
        run: |
          # usign-ключ фида, приватные ключи обновлений, токены.
          # Исключаем только сам файл проверки (аудит №1 P3-4)
          if git grep -n -E 'untrusted comment: .*secret|untrusted comment: .*private key|BEGIN (RSA|EC|OPENSSH) PRIVATE KEY' \
               -- ':!.github/workflows/ci.yml'; then
            echo "FAIL: похоже на приватный ключ" >&2
            exit 1
          fi
          echo "ok"

      - name: "SPDX-заголовки"
        run: |
          fail=0
          for f in $(git ls-files 'lavrayd/*' 'lavray-webui/*' 'luci-app-lavray/*'); do
            case "$f" in
              *.json|*.js|*.pub|*.keep) continue ;;
            esac
            grep -q "SPDX-License-Identifier: GPL-3.0-only" "$f" || {
              echo "FAIL: нет SPDX в $f" >&2; fail=1; }
          done
          exit $fail