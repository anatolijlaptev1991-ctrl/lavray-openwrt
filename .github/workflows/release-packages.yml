name: release-packages

# Сборка пакетов OpenWrt и публикация фида (спецификация
# OPENWRT-PACKAGING.md §4). Запуск: тег v* или вручную.
#
# Сборка — openwrt/gh-action-sdk (эталонный путь для пакетов с luci- и
# kmod-зависимостями): официальный SDK-контейнер, полный разбор зависимостей
# (lucihttp→lua, kmod-tun, curl), INDEX=1 строит Packages и подписывает
# usign-ключом KEY_BUILD (Environment feed-signing). Без ключа — фид без
# Packages.sig, как релизы 0.9.x без meta/ до церомонии ключей.
#
# Контейнеры: openwrt/sdk:<цель>-<патч-релиз> (пин 24.10.8; теги —
# hub.docker.com/repositories/openwrt/sdk). Метка ipk внутри SDK остаётся
# целевой (x86_64, aarch64_cortex-a53, ...), не именем контейнера.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      sdk_version:
        description: "Патч-релиз SDK OpenWrt (24.10.8); служебное, менять осознанно"
        required: false
        default: '24.10.8'

permissions:
  contents: read

# Параллельные прогоны на одном теге мешают друг другу (force-push gh-pages,
# перезапись ассетов) — как release-signing в lavray, без отмены.
concurrency:
  group: release-packages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      KEY_BUILD: ${{ secrets.LAVRAY_FEED_KEY }}
      SDK_VERSION: ${{ inputs.sdk_version || '24.10.8' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { label: 'x86_64' }
          - { label: 'aarch64_cortex-a53' }
          - { label: 'aarch64_cortex-a72' }
          - { label: 'aarch64_generic' }

    steps:
      - uses: actions/checkout@v4

      - name: "SDK-сборка: lavrayd, lavray-webui, luci-app-lavray (${{ matrix.label }})"
        uses: openwrt/gh-action-sdk@v6
        env:
          ARCH: ${{ matrix.label }}-${{ env.SDK_VERSION }}
          FEEDNAME: lavray
          PACKAGES: lavrayd lavray-webui luci-app-lavray
          INDEX: 1
          NO_SHFMT_CHECK: 1
          V: ''

      - name: "Артефакт: feed-${{ matrix.label }}"
        uses: actions/upload-artifact@v4
        with:
          name: feed-${{ matrix.label }}
          # logs не публикуем (аудит №1 P3-1): артефакт публичен, verbose-лог
          # может раскрыть материал подписи.
          path: |
            bin/packages/*/lavray/*
            bin/packages/*/packages/*

  publish:
    needs: build
    runs-on: ubuntu-24.04
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    env:
      SDK_VERSION: ${{ inputs.sdk_version || '24.10.8' }}
    steps:
      - uses: actions/checkout@v4

      - name: "Скачивание артефактов"
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: "Сборка дерева фида и tarball-ов по целям"
        run: |
          mkdir -p gh-pages feed-tars
          # Дерево артефактов: artifacts/feed-<метка>/<arch>/<feedname>/...
          # В gh-pages: <версия SDK>/<метка>/packages/... — как в docs/INSTALL.md
          # и спецификации §4.2 (arch внутри SDK равен метке).
          for art in artifacts/feed-*; do
            [ -d "$art" ] || continue
            label="$(basename "$art" | sed 's/^feed-//')"
            pkgdir="$(find "$art" -type d -name lavray | head -n1)"
            [ -n "$pkgdir" ] || pkgdir="$(find "$art" -type d -name packages | head -n1)"
            test -n "$pkgdir" || { echo "::error title=Нет пакетов::в $art нет каталога пакетов"; exit 1; }
            (cd "$pkgdir" && tar -czf "$OLDPWD/feed-tars/lavray-feed-$SDK_VERSION-$label.tar.gz" .)
            mkdir -p "gh-pages/$SDK_VERSION/$label/packages"
            cp "$pkgdir"/* "gh-pages/$SDK_VERSION/$label/packages/"
          done
          # Открытый ключ фида для роутеров (opkg-key add)
          [ -f feed/key.pub ] && cp feed/key.pub gh-pages/key.pub
          find gh-pages -type f | sort | head -30
          ls -la feed-tars/

      - name: "gh-pages: публикация фида"
        working-directory: gh-pages
        # persist-credentials от actions/checkout даёт push без токена в URL
        # (аудит №1 P3-2: токен в argv виден в ps на раннере).
        run: |
          git init -q -b gh-pages
          git config user.name "lavray-openwrt-ci"
          git config user.email "noreply@github.com"
          git add -A
          git commit -qm "feed: ${{ github.ref_name }}"
          git push -qf origin gh-pages
          echo "фид: https://${{ github.repository_owner }}.github.io/${GITHUB_REPOSITORY#*/}/"

      - name: "Релиз lavray-openwrt: tarball фида по целям"
        uses: softprops/action-gh-release@v2
        with:
          name: "OpenWrt feed ${{ github.ref_name }}"
          files: |
            feed-tars/*.tar.gz
          generate_release_notes: true
